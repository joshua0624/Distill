# Hard rules — applied to every video, no LLM involved.

# Anything this short or shorter gets checked against youtube.com/shorts/<id>.
shorts_max_s: 180

# Videos shorter than this are hidden. Sport rules can set their own minimum.
min_duration_s: 240

# Case-insensitive substrings; a title containing any of these is hidden.
blocked_title_keywords: []

# RSS returns each channel's 15 latest uploads; ignore anything older than this.
max_video_age_days: 14

# Classification — mixed-channel videos that pass the hard rules go to the LLM,
# then config/rules.yaml decides what to show.
llm_model: claude-haiku-5-5
# USD per million tokens for llm_model; used to track spend. Batches cost half.
llm_price_input_per_mtok: 0.10
llm_price_output_per_mtok: 0.50
# Classification stops for the month once this much has been spent.
llm_monthly_budget_usd: 3.00
# This many videos or more go through the Batch API (half price, minutes to an hour);
# fewer are classified straight away.
llm_batch_threshold: 20

# Discovery — videos from channels you don't follow yet, shown in their own row on Home.
# At most this many discovery videos show at once.
discovery_daily_cap: 10
discovery_max_age_days: 30
# Videos from channels you don't follow need at least this many views (checked before the LLM).
discovery_min_views: 1000
# Saved searches from config/discovery.yaml: each costs 100 of the 10,000 daily quota units.
discovery_searches_per_run: 10
discovery_search_every_h: 8
# Hacker News stories linking YouTube, at or above this many points.
discovery_hn_every_h: 12
discovery_hn_min_points: 50
# The LLM suggests channels that fit config/taste.md; each one is checked before it's added.
discovery_llm_every_days: 7
# Channels linked or featured by videos you liked or watched past halfway.
discovery_adjacent_channels_per_run: 10

# Schedule — used by `distill serve --schedule` (the always-on setup in docs/deploy.md).
# Fetch, discover and classify this often. Each run uses ~100-1,100 of the 10,000 daily quota units.
ingest_every_h: 2
# Back up the database once a day after this hour (local time) to data/backups, keeping this many.
backup_hour: 4
backup_keep: 14
